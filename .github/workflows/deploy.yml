name: CI Setup

on:
  push:
    branches:
      - main   # your current branch (VERY IMPORTANT)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Success
        run: echo "GitHub Actions Working 🚀"